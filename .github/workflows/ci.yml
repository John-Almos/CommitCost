name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Mock demo runs with no credentials
        run: npm run demo:check
      - name: Dashboard builds
        run: npm run build:web

  # Dogfood the PR cost check on this repo's own PRs. Dry run: results go to
  # the job summary only, so CI needs no write permission.
  cost-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          dry-run: "true"
